services:
  # 1. High-Performance Distributed Event Broker (Redpanda)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: nexus-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --schema-registry-addr 0.0.0.0:8081
    ports:
      - "19092:19092"
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Web Console for Topic & Consumer Inspection
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: nexus-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"

  # 2. Apache Flink Stateful Processing Engine
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: nexus-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: nexus-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # 3. FastAPI Low-Latency ML Inference Microservice
  inference-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus-inference-api
    ports:
      - "8000:8000"
    environment:
      - DUCKDB_PATH=/app/data/nexus_analytics.duckdb
    volumes:
      - duckdb-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Stream Enrichment & Scoring Processor
  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus-stream-processor
    depends_on:
      redpanda:
        condition: service_healthy
      inference-api:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=redpanda:9092
      - INFERENCE_URL=http://inference-api:8000/v1/predict-fraud
      - DUCKDB_PATH=/app/data/nexus_analytics.duckdb
    command: ["python", "-m", "src.streaming.processor", "--broker", "redpanda:9092", "--inference-url", "http://inference-api:8000/v1/predict-fraud"]
    volumes:
      - duckdb-data:/app/data

  # 5. Synthetic Transaction Simulator
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus-simulator
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["python", "-m", "src.simulator.generate_transactions", "--rate", "100", "--target", "kafka", "--kafka-broker", "redpanda:9092"]

  # 6. Streamlit Fraud Operations & Dispute Portal
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: nexus-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://inference-api:8000
      - DUCKDB_PATH=/app/data/nexus_analytics.duckdb
    volumes:
      - duckdb-data:/app/data
    depends_on:
      inference-api:
        condition: service_healthy

  # 7. Metrics & Observability
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.3.3
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  duckdb-data:
