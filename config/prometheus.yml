global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "nexus-inference-api"
    static_configs:
      - targets: ["inference-api:8000"]
    metrics_path: "/metrics"

  - job_name: "nexus-stream-processor"
    static_configs:
      - targets: ["stream-processor:8000"]
